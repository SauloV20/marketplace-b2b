# Rastreio automático das etiquetas do Melhor Envio: de segunda a sábado, às 8h, 11h, 14h, 17h e 20h (Brasília),
# pede ao site para conferir as etiquetas em andamento. Postada: o pedido vira "enviado" e o cliente recebe o
# rastreio por e-mail; entregue: o pedido vira "entregue".
# Usa os mesmos segredos do backup semanal (Settings > Secrets and variables > Actions): SITE_URL e TAREFAS_TOKEN.
name: Rastreio automático
on:
  schedule:
    - cron: "7 11,14,17,20,23 * * 1-6"
  workflow_dispatch: {}
jobs:
  rastreio:
    runs-on: ubuntu-latest
    steps:
      - name: Pedir ao site para atualizar o rastreio
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          TAREFAS_TOKEN: ${{ secrets.TAREFAS_TOKEN }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$TAREFAS_TOKEN" ]; then
            echo "Segredos SITE_URL e TAREFAS_TOKEN não configurados: nada a fazer."; exit 0
          fi
          # o plano grátis do Render dorme: a primeira chamada acorda o site (pode levar um minuto)
          curl -fsS --retry 4 --retry-delay 30 --retry-all-errors --max-time 240 -X POST \
            -H "Authorization: Bearer $TAREFAS_TOKEN" "${SITE_URL%/}/tarefas/rastreio"
