# Lembrete do carrinho abandonado: todo dia, às 9h, 13h e 18h (Brasília), pede ao site para mandar o e-mail a quem
# deixou produtos no carrinho (regras e configuração em Painel > Carrinhos abandonados).
# Usa os mesmos segredos do backup semanal (Settings > Secrets and variables > Actions): SITE_URL e TAREFAS_TOKEN.
name: Carrinho abandonado
on:
  schedule:
    - cron: "23 12,16,21 * * *"
  workflow_dispatch: {}
jobs:
  carrinhos:
    runs-on: ubuntu-latest
    steps:
      - name: Pedir ao site para mandar os lembretes
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          TAREFAS_TOKEN: ${{ secrets.TAREFAS_TOKEN }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$TAREFAS_TOKEN" ]; then
            echo "Segredos SITE_URL e TAREFAS_TOKEN não configurados: nada a fazer."; exit 0
          fi
          # o plano grátis do Render dorme: a primeira chamada acorda o site (pode levar um minuto)
          curl -fsS --retry 4 --retry-delay 30 --retry-all-errors --max-time 240 -X POST \
            -H "Authorization: Bearer $TAREFAS_TOKEN" "${SITE_URL%/}/tarefas/carrinhos"
