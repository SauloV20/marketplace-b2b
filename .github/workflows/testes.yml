name: Testes

# Roda os testes automáticos a cada envio para o GitHub. No Render, com "Auto-Deploy: After CI Checks Pass",
# o site só é publicado quando estes testes passam: um erro nunca chega à loja no ar.
on:
  push:
  pull_request:

concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: true  # dois envios seguidos: só o mais novo é testado

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt
      - name: Conferir se todos os arquivos Python abrem sem erro de sintaxe
        run: python -m compileall -q -x "(venv|\.git)" .
      - name: Rodar os testes automáticos
        run: python -m unittest discover -s tests
